name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Un avis de vulnérabilité paraît sans que le dépôt bouge : le passage
  # hebdomadaire (branche par défaut uniquement) relance l'analyse seule. Le
  # jeudi laisse le temps de publier un correctif avant l'installation
  # automatique du dimanche.
  schedule:
    - cron: "17 6 * * 4"

permissions:
  contents: read

jobs:
  build:
    name: Vérifications
    # Le reste ne dépend que du code : inutile de le rejouer chaque semaine.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatage
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: Analyse statique
        run: go vet ./...

      - name: Tests
        run: go test ./... -race -count=1

      - name: Compilation du binaire statique
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/animestats ./cmd/animestats

      - name: Vérification des unités systemd
        run: |
          sudo install -m0755 /tmp/animestats /usr/local/bin/animestats
          sudo install -D -m0755 deploy/install.sh /usr/local/lib/animestats/install.sh
          systemd-analyze verify deploy/animestats.service \
                                 deploy/animestats-update.service \
                                 deploy/animestats-update.timer

      - name: Vérification du script d'installation
        run: |
          bash -n deploy/install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/install.sh

  vulns:
    name: Vulnérabilités connues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Outil épinglé : seule la base d'avis, toujours à jour, doit pouvoir
      # faire échouer ce contrôle. Il juge la bibliothèque standard de la
      # chaîne installée ci-dessus, donc celle des releases, et n'échoue que
      # si le code appelle réellement une fonction vulnérable.
      - name: Analyse govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
