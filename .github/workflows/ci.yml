name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatage
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: Analyse statique
        run: go vet ./...

      - name: Tests
        run: go test ./... -race -count=1 -cover

      - name: Compilation du binaire statique
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/animestats ./cmd/animestats

      - name: Vérification de l'unité systemd
        run: |
          sudo install -m0755 /tmp/animestats /usr/local/bin/animestats
          systemd-analyze verify deploy/animestats.service

      - name: Vérification du script d'installation
        run: |
          bash -n deploy/install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/install.sh
